<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GainUI</title>
<meta name="description" content="GainUI - a drawn GUI library for Matcha. Windows, tabs, toggles, sliders, dropdowns, keybinds, color pickers and saved settings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b93ff'/%3E%3Cstop offset='.55' stop-color='%23c29cff'/%3E%3Cstop offset='1' stop-color='%23ffd36b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='6' y='6' width='20' height='20' rx='5' fill='%230b0f18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #0b0f18; --card: #171e2b; --card-2: #1e2636; --rail: #252f42; --line: #28324a; --line-soft: #1f2839;
  --txt: #edf1f7; --muted: #8a96ab; --muted-2: #5f6b80;
  --blue: #5b93ff; --blue-hi: #7aa8ff; --blue-ink: #0c1a33; --violet: #c29cff; --gold: #ffd36b; --good: #6fdc9a;
  --r-tile: 16px; --r-sheet: 22px; --r-ctl: 11px; --ease: cubic-bezier(.2, .8, .2, 1);
  --glass: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035) 45%, rgba(255,255,255,.05));
  --glass-strong: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05) 50%, rgba(255,255,255,.07));
  --glass-edge: rgba(255,255,255,.12);
  --glass-shine: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.05), inset 0 0 0 1px rgba(255,255,255,.03);
  --blur: blur(22px) saturate(170%);
  --kw: #c29cff; --str: #9be3b4; --num: #ffc68a; --com: #5f6b80; --fn: #7aa8ff;
}
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--txt); font: 14.5px/1.6 Comfortaa, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 110px; min-height: 100vh; }
a { color: var(--blue-hi); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
::selection { background: #2c4a86; }
code, pre, kbd { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }

/* The colour field the glass bends light from */
.glass-field { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; overflow: hidden; }
.glass-field i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .42; animation: drift 38s ease-in-out infinite alternate; }
.glass-field i:nth-child(1) { width: 60vmax; height: 60vmax; left: 8%; top: 4%; background: #2447a8; }
.glass-field i:nth-child(2) { width: 46vmax; height: 46vmax; right: 6%; top: 18%; background: #5b2c9e; animation-duration: 46s; animation-delay: -12s; }
.glass-field i:nth-child(3) { width: 38vmax; height: 38vmax; left: 34%; bottom: 2%; background: #0f6f7c; opacity: .4; animation-duration: 52s; animation-delay: -24s; }
.glass-field i:nth-child(4) { width: 22vmax; height: 22vmax; right: 24%; bottom: 18%; background: #b07a1c; opacity: .28; animation-duration: 60s; }
@keyframes drift { to { transform: translate3d(6vmax, -4vmax, 0) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .glass-field i { animation: none; } }

.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shine), 0 10px 30px rgba(0,0,0,.22); }

/* Header */
.nav { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 58px;
  background: linear-gradient(180deg, rgba(20,26,40,.55), rgba(20,26,40,.35)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: inset 0 -1px 0 rgba(255,255,255,.06); }
.nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--txt); white-space: nowrap; }
.nav-brand:hover { text-decoration: none; }
.nav-logo { width: 26px; height: 26px; border-radius: 8px; flex: none; background: conic-gradient(from 210deg, #5b93ff, #c29cff, #ffd36b, #5b93ff); box-shadow: inset 0 0 0 5px var(--bg); }
.nav-sub { color: var(--muted); font-size: 13px; white-space: nowrap; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-pill { display: flex; align-items: center; gap: 9px; height: 36px; min-width: 220px; padding: 0 8px 0 12px; border-radius: var(--r-ctl);
  color: var(--muted); font-size: 13px; cursor: pointer; }
.search-pill:hover { color: var(--txt); background: var(--glass-strong); }
.search-pill kbd { margin-left: auto; }
kbd { font-size: 11px; color: var(--muted); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 1px 6px; }

/* Buttons */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; font: 600 13px Comfortaa, sans-serif; cursor: pointer;
  border-radius: var(--r-ctl); padding: 9px 16px; border: 1px solid var(--line); background: transparent; color: var(--txt);
  transition: background .18s, border-color .18s, transform .12s, box-shadow .18s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); transform: translateY(-1px); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #7eaaff, #4f86f5); border-color: rgba(255,255,255,.25); color: var(--blue-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 18px rgba(79,134,245,.35); }
.btn.primary:hover { background: linear-gradient(180deg, #92b8ff, #5d91fa); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 24px rgba(79,134,245,.45); }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-18deg); transition: left .6s var(--ease); }
.btn:hover::after { left: 120%; }
.btn svg { width: 16px; height: 16px; }
.icon-only { padding: 9px; }

.page-wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Section switch (like the skin site's tabs) */
.dash-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 22px 0 14px; }
.dash-switch { display: flex; gap: 2px; padding: 4px; border-radius: 14px; overflow-x: auto; scrollbar-width: none; max-width: 100%; position: relative; isolation: isolate; }
.dash-switch::-webkit-scrollbar { display: none; }
.dash-switch a { padding: 8px 18px; border-radius: 10px; color: var(--muted); white-space: nowrap; font-size: 13.5px; font-weight: 600; transition: color .18s; }
.dash-switch a:hover { color: var(--txt); text-decoration: none; }
.dash-switch a.active { color: var(--txt); }
.seg-ind { position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 14px rgba(0,0,0,.25);
  transition: transform .45s cubic-bezier(.3,1.3,.4,1), width .45s cubic-bezier(.3,1.3,.4,1), opacity .2s; opacity: 0; }
.version { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }

/* Page pills */
.pills { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 18px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted);
  border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); transition: color .18s, background .18s, border-color .18s; }
.pill:hover { color: var(--txt); background: rgba(255,255,255,.07); text-decoration: none; }
.pill.active { color: var(--txt); background: rgba(91,147,255,.16); border-color: rgba(122,168,255,.4); }
.pill svg { width: 14px; height: 14px; }

/* The page itself */
.sheet { border-radius: var(--r-sheet); padding: 30px 34px 34px; }
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 7px; align-items: center; }
.crumbs b { color: var(--blue-hi); font-weight: 600; }
.title-row { display: flex; align-items: center; gap: 14px; }
.title-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: radial-gradient(75% 60% at 50% 100%, rgba(91,147,255,.35), transparent 72%), rgba(8,12,20,.45); border: 1px solid rgba(255,255,255,.08); color: #cfe0fa; }
.title-ico svg { width: 22px; height: 22px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0; font-weight: 700; color: #f3f6fb; }
.lead { font-size: 15.5px; color: var(--muted); margin: 12px 0 22px; max-width: 70ch; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 22px; }
.jump a { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); }
.jump a:hover { color: var(--txt); text-decoration: none; background: rgba(255,255,255,.08); }
h2 { font-size: 20px; margin: 36px 0 10px; scroll-margin-top: 80px; color: #f3f6fb; }
h3 { font-size: 16px; margin: 26px 0 8px; scroll-margin-top: 80px; }
h2 a.anchor, h3 a.anchor { opacity: 0; margin-left: 8px; color: var(--muted-2); font-size: .8em; }
h2:hover a.anchor, h3:hover a.anchor { opacity: 1; }
p { margin: 10px 0; }
ul { padding-left: 22px; margin: 10px 0; }
li { margin: 5px 0; }
li::marker { color: var(--blue-hi); }
:not(pre) > code { font-size: 12.5px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 1px 6px; color: #dbe6fb; }
.code { position: relative; margin: 16px 0; border-radius: var(--r-tile); background: rgba(6,10,18,.55); border: 1px solid rgba(255,255,255,.07); overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 11.5px; color: var(--muted-2); }
.code-head span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--violet); margin-right: 8px; vertical-align: 1px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 12.8px; line-height: 1.65; }
.copy { font: 600 11.5px Comfortaa, sans-serif; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.copy:hover { color: var(--txt); background: rgba(255,255,255,.1); }
.sig { font-family: "JetBrains Mono", monospace; font-size: 12.8px; background: rgba(91,147,255,.1); border: 1px solid rgba(122,168,255,.25); color: #dbe6fb; border-radius: 12px; padding: 10px 14px; margin: 12px 0; overflow-x: auto; white-space: nowrap; }
.tok-kw { color: var(--kw); } .tok-str { color: var(--str); } .tok-num { color: var(--num); } .tok-com { color: var(--com); font-style: italic; } .tok-fn { color: var(--fn); }
.table-wrap { overflow-x: auto; margin: 14px 0; border-radius: var(--r-tile); border: 1px solid rgba(255,255,255,.08); background: rgba(8,12,20,.3); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 700; background: rgba(255,255,255,.04); }
tr:last-child td { border-bottom: none; }
td:first-child code { white-space: nowrap; }
.hint { display: flex; gap: 12px; padding: 13px 16px; border-radius: var(--r-tile); margin: 16px 0; font-size: 13.5px;
  background: linear-gradient(160deg, rgba(91,147,255,.14), rgba(91,147,255,.05)); border: 1px solid rgba(122,168,255,.28); }
.hint.warn { background: linear-gradient(160deg, rgba(255,211,107,.13), rgba(255,211,107,.04)); border-color: rgba(255,211,107,.3); }
.hint svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; color: var(--blue-hi); }
.hint.warn svg { color: var(--gold); }
.hint p { margin: 0; }

/* Tiles that lean toward the pointer, with a glare that follows it */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 18px 0; }
.tile { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%; position: relative; display: block; border-radius: var(--r-tile); padding: 14px; color: var(--txt);
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shine), 0 10px 30px rgba(0,0,0,.22);
  transform-style: preserve-3d; transition: border-color .25s, background .25s, box-shadow .35s, transform .5s var(--ease); overflow: hidden; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx) var(--my), rgba(255,255,255,.16), transparent 45%); opacity: 0; transition: opacity .3s; }
.tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: radial-gradient(200px circle at var(--mx) var(--my), color-mix(in srgb, var(--blue) 80%, #fff), transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .3s; }
.tile:hover { transform: perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px); background: var(--glass-strong); text-decoration: none;
  box-shadow: var(--glass-shine), 0 22px 40px rgba(0,0,0,.38), 0 0 0 1px rgba(91,147,255,.25); }
.tile:hover::after, .tile:hover::before { opacity: 1; }
.tile:active { transform: perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) scale(.98); transition-duration: .12s; }
.tile .mock { height: 64px; border-radius: 12px; margin-bottom: 12px; display: grid; place-items: center; padding: 0 14px;
  background: radial-gradient(75% 60% at 50% 100%, rgba(91,147,255,.22), transparent 72%), rgba(8,12,20,.45); border: 1px solid rgba(255,255,255,.06); transform: translateZ(10px); }
.tile b { display: block; font-size: 14.5px; transform: translateZ(18px); }
.tile span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; transform: translateZ(14px); }
/* tiny drawn controls inside tiles (GainUI's own colors) */
.m-row { width: 100%; height: 26px; border-radius: 6px; background: #1c1e27; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; font-size: 10.5px; color: #e2e5ec; }
.m-sw { width: 28px; height: 14px; border-radius: 7px; background: #568cff; position: relative; } .m-sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.m-tr { width: 100%; height: 5px; border-radius: 3px; background: #2c2f3c; position: relative; } .m-tr i { position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 3px; background: #568cff; }
.m-tr b { position: absolute; left: 58%; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #e2e5ec; }
.m-box { width: 100%; height: 24px; border-radius: 5px; background: #16181f; border: 1px solid #2c2f3c; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 10.5px; color: #e2e5ec; }
.m-key { padding: 2px 8px; border-radius: 5px; background: #16181f; border: 1px solid #2c2f3c; font-size: 10px; }
.m-btn { width: 100%; height: 26px; border-radius: 6px; background: #1c1e27; border: 1px solid #568cff; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #e2e5ec; }
.m-hue { width: 100%; height: 10px; border-radius: 3px; background: linear-gradient(90deg, red, #ff0, lime, cyan, blue, #f0f, red); }
.m-row svg { width: 18px; height: 18px; color: #8a90a0; }
.m-sec { width: 100%; display: flex; align-items: center; gap: 8px; color: #568cff; font-size: 10px; font-weight: 700; letter-spacing: .06em; } .m-sec::after { content: ""; flex: 1; height: 1px; background: #2c2f3c; }
.m-note { width: 100%; border-radius: 6px; background: #0f1015; border: 1px solid #2c2f3c; padding: 5px 8px 5px 11px; font-size: 10px; color: #8a90a0; position: relative; }
.m-note::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: #568cff; }
.m-note b { color: #e2e5ec; font-size: 10.5px; transform: none; }

/* Home hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 26px; align-items: center; margin-bottom: 8px; }
.hero h1 { font-size: 36px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, #7aa8ff, #c29cff 60%, #ffd36b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { margin: 12px 0 18px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.preview { border-radius: var(--r-tile); padding: 14px; background: rgba(6,10,18,.55); border: 1px solid rgba(255,255,255,.07); overflow-x: auto; }
.gw { width: 470px; height: 262px; margin: 0 auto; display: flex; border-radius: 10px; border: 1px solid #2c2f3c; background: #0f1015; overflow: hidden; color: #e2e5ec; font-size: 11.5px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.gw .gs { width: 120px; background: #13141b; border-right: 1px solid #2c2f3c; padding: 12px 7px; }
.gw .gs .t { font-weight: 700; font-size: 13px; padding: 0 7px; }
.gw .gs .st { color: #568cff; font-size: 10px; padding: 0 7px 12px; }
.gw .gs .tab { padding: 5px 10px; border-radius: 6px; color: #8a90a0; margin-bottom: 3px; position: relative; }
.gw .gs .tab.on { background: #1c1e27; color: #e2e5ec; font-weight: 700; }
.gw .gs .tab.on::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; background: #568cff; }
.gw .gp { flex: 1; padding: 12px 14px; }
.gw .gp h5 { margin: 0 0 10px; font-size: 14px; }
.gw .row { height: 29px; background: #1c1e27; border-radius: 6px; margin-bottom: 6px; display: flex; align-items: center; padding: 0 10px; justify-content: space-between; }
.gw .sw { width: 30px; height: 15px; border-radius: 8px; background: #568cff; position: relative; }
.gw .sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
.gw .sw.off { background: #2c2f3c; } .gw .sw.off::after { right: auto; left: 2px; background: #8a90a0; }
.gw .sl { height: 40px; flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; }
.gw .sl .l { display: flex; justify-content: space-between; } .gw .sl .l span { color: #8a90a0; }
.gw .tr { height: 5px; border-radius: 3px; background: #2c2f3c; position: relative; } .gw .tr i { position: absolute; left: 0; top: 0; bottom: 0; width: 42%; background: #568cff; border-radius: 3px; }
.gw .sec { color: #568cff; font-weight: 700; font-size: 10px; letter-spacing: .05em; margin: 2px 0 7px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin: 18px 0; }
.card { display: block; padding: 16px; border-radius: var(--r-tile); color: var(--txt); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); transition: background .2s, border-color .2s, transform .2s; }
.card:hover { background: rgba(255,255,255,.08); border-color: rgba(122,168,255,.35); text-decoration: none; transform: translateY(-2px); }
.card b { display: block; margin-bottom: 4px; }
.card span { color: var(--muted); font-size: 13px; }

/* Previous / next */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; }
.pager a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--r-tile); color: var(--txt); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); transition: background .2s, border-color .2s; }
.pager a:hover { background: rgba(255,255,255,.08); border-color: rgba(122,168,255,.35); text-decoration: none; }
.pager a.next { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: 11.5px; }
.pager b { font-weight: 700; }
.updated { color: var(--muted-2); font-size: 12px; margin-top: 16px; }

/* Floating bar (like the skin site's download bar) */
.footbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 55; width: min(1040px, calc(100% - 32px));
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 18px; border-radius: 18px; background-color: rgba(20,26,40,.55); }
.footbar .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; min-width: 0; }
.footbar .status code { background: none; border: none; padding: 0; color: #cfe0fa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.footbar .acts { margin-left: auto; display: flex; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 86px; transform: translate(-50%, 12px); opacity: 0; z-index: 70; padding: 10px 16px; border-radius: 12px;
  background-color: rgba(30,38,56,.7); font-size: 13px; transition: opacity .25s, transform .35s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Search */
.sd { position: fixed; inset: 0; z-index: 80; background: rgba(6,9,15,.5); -webkit-backdrop-filter: blur(12px) saturate(140%); backdrop-filter: blur(12px) saturate(140%);
  display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 0; }
.sd.open { display: flex; }
.sbox { width: 100%; max-width: 580px; border-radius: var(--r-sheet); overflow: hidden; background-color: rgba(20,26,40,.86); }
.sbox input { width: 100%; height: 54px; border: none; border-bottom: 1px solid rgba(255,255,255,.08); background: none; color: var(--txt); font: inherit; font-size: 15px; padding: 0 20px; outline: none; }
.sres { max-height: 50vh; overflow-y: auto; padding: 8px; }
.sres a { display: block; padding: 10px 12px; border-radius: 12px; color: var(--txt); font-weight: 600; }
.sres a small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sres a.sel, .sres a:hover { background: rgba(91,147,255,.16); text-decoration: none; }
.sres .none { padding: 18px; color: var(--muted); text-align: center; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .nav-sub { display: none; }
  .search-pill { min-width: 0; } .search-pill .label, .search-pill kbd { display: none; }
}
@media (max-width: 620px) {
  .nav { padding: 0 14px; gap: 10px; }
  .nav-right .gh-label { display: none; }
  .page-wrap { padding: 0 16px; }
  .sheet { padding: 22px 18px 26px; border-radius: 18px; }
  h1, .hero h1 { font-size: 26px; }
  .title-ico { width: 40px; height: 40px; }
  .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; }
  .footbar .status { display: none; } .footbar .acts { margin: 0 auto; }
  .version { display: none; }
}

<script>
const RAW = "https://raw.githubusercontent.com/Martinikaws/GainUI/main/GainUI.lua";
const LOAD = `local GainUI = loadstring(game:HttpGet("${RAW}"))() or _G.GainUI`;
const UPDATED = "Updated for GainUI 1.0.0";

// Icons (lucide-style strokes)
const I = {
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  click: '<rect x="3" y="8" width="18" height="8" rx="4"/>',
  toggle: '<rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="16" cy="12" r="3"/>',
  slider: '<path d="M4 12h16"/><circle cx="10" cy="12" r="3"/>',
  list: '<path d="m6 9 6 6 6-6"/><rect x="3" y="3" width="18" height="18" rx="2"/>',
  type: '<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
  key: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  palette: '<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.5-.8 1.5-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.6 1.6 0 0 1 1.6-1.6H16a6 6 0 0 0 6-6C22 6 17.5 2 12 2z"/>',
  text: '<path d="M17 6.1H3M21 12.1H3M15.1 18H3"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  swap: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

// Content helpers
const code = (src, lang = "lua") => `<div class="code"><div class="code-head"><span>${lang}</span><button class="copy">Copy</button></div><pre><code data-lang="${lang}">${esc(src.trim())}</code></pre></div>`;
const sig = s => `<div class="sig">${esc(s)}</div>`;
const hint = (s, kind) => `<div class="hint ${kind || ""}">${svg(kind === "warn" ? "alert" : "info")}<div>${s}</div></div>`;
const table = (head, rows) => `<div class="table-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const opts = rows => table(["Option", "Type", "Default", "Description"], rows);
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
const c = s => `<code>${esc(s)}</code>`;

const ELEMENT_RETURNS = `<p>Returns the element. Keep it to change it later: ${c(":Set(value)")}, ${c(":Get()")}, ${c(".Value")}; see <a href="#/elements/methods">Element methods</a>.</p>`;

const PAGES = [
  { group: "Introduction", id: "", title: "Getting Started", icon: "book", lead: "A drawn GUI library for Matcha. Build a Gain-style window with tabs, toggles, sliders, dropdowns and keybinds in a few lines.",
    body: () => `
<h2 id="install">Install</h2>
<p>Load the library at the top of your script. There's nothing to download: it always runs the latest version from GitHub.</p>
${code(LOAD)}
${hint(`Why ${c("or _G.GainUI")}? Matcha's ${c("loadstring")} drops return values, so GainUI also puts itself in ${c("_G.GainUI")}. This line works in Matcha and in executors that do return.`)}
<h2 id="first-window">Your first window</h2>
${code(`${LOAD}

local Window = GainUI:CreateWindow({
    Title = "My Script",
    Subtitle = "v1.0",
    ConfigName = "myscript", -- remembers every flagged value between runs
})

local Main = Window:Tab("Main")
Main:Section("General")

Main:Toggle({
    Name = "Enabled",
    Default = false,
    Flag = "Enabled",
    Callback = function(on)
        print("Enabled:", on)
    end,
})

Main:Slider({Name = "Walk speed", Min = 16, Max = 100, Default = 16, Suffix = " studs", Flag = "Speed",
    Callback = function(v) print(v) end})

Main:Button({Name = "Hello", Callback = function()
    Window:Notify({Title = "Hello!", Content = "It works."})
end})`)}
<p>Press <kbd>Right Shift</kbd> to show or hide the window. Drag it by the title. Every window also gets a <b>Settings</b> tab, where users can change the show/hide key and the accent color and unload the script.</p>
<h2 id="next">Next steps</h2>
<div class="cards">
  <a class="card" href="#/window/create"><b>Window</b><span>Title, size, accent, keys and saving.</span></a>
  <a class="card" href="#/elements/toggle"><b>Elements</b><span>Every control you can put in a tab.</span></a>
  <a class="card" href="#/guides/matcha"><b>Matcha notes</b><span>What the library does for you, and its limits.</span></a>
  <a class="card" href="#/start/example"><b>Full example</b><span>Every element in one script.</span></a>
</div>` },

  { group: "Introduction", id: "start/example", title: "Example", icon: "play", lead: "One script that uses every element. Paste it into Matcha to see them all.",
    body: () => code(`${LOAD}

local Window = GainUI:CreateWindow({Title = "GainUI", Subtitle = "Example", ConfigName = "example"})

local Main = Window:Tab("Main")
Main:Section("Basics")
Main:Label("Everything here is drawn with Matcha's Drawing library.")
Main:Toggle({Name = "Enabled", Default = false, Flag = "Enabled", Callback = function(on) print("Enabled:", on) end})
Main:Slider({Name = "Walk speed", Min = 16, Max = 100, Default = 16, Suffix = " studs", Flag = "Speed",
    Callback = function(v) print("Speed:", v) end})
Main:Button({Name = "Say hi", Callback = function()
    Window:Notify({Title = "Hi!", Content = "Buttons run their callback when clicked.", Duration = 3})
end})

Main:Section("Choices")
Main:Dropdown({Name = "Mode", Options = {"Legit", "Balanced", "Chaos"}, Default = "Balanced", Flag = "Mode",
    Callback = function(opt) print("Mode:", opt) end})
Main:Dropdown({Name = "Parts", Options = {"Head", "Torso", "Arms", "Legs"}, Multi = true, Default = {"Head"},
    Flag = "Parts", Callback = function(list) print(table.concat(list, ", ")) end})
Main:Textbox({Name = "Player name", Placeholder = "Type and press Enter", Flag = "Target",
    Callback = function(text) print("Target:", text) end})

local Extra = Window:Tab("Extra")
Extra:Keybind({Name = "Say something", Default = "G", Flag = "SayKey", Callback = function()
    Window:Notify({Title = "Keybind", Content = "You pressed the key."})
end})
Extra:Keybind({Name = "Hold to show", Default = "H", Mode = "Hold", Callback = function(held) print(held) end})
Extra:Colorpicker({Name = "Box color", Default = Color3.fromRGB(255, 80, 80), Flag = "BoxColor",
    Callback = function(c) print(c) end})
Extra:Paragraph({Title = "About", Content = "Long tabs scroll: drag the page or its bar, or use Page Up / Page Down."})

print("Speed is", GainUI.Flags.Speed.Value)`) + `<p>The same file is in the repository as <a href="https://github.com/Martinikaws/GainUI/blob/main/example.lua" target="_blank" rel="noopener">example.lua</a>.</p>` },

  { group: "Window", id: "window/create", title: "CreateWindow", icon: "window", lead: "Makes a window and returns it. A script can make more than one.",
    body: () => sig("GainUI:CreateWindow(options: table) -> Window") + code(`local Window = GainUI:CreateWindow({
    Title = "My Script",
    Subtitle = "v1.0",
    ConfigName = "myscript",
    ToggleKey = "RightShift",
    Accent = "568cff",
    Size = {620, 460},
})`) + `<h2 id="options">Options</h2>` + opts([
      [c("Title"), "string", c('"GainUI"'), "Shown at the top of the sidebar."],
      [c("Subtitle"), "string", "none", "A smaller line under the title, in the accent color."],
      [c("ConfigName"), "string", "none", `Saves flagged elements to ${c("Folder/ConfigName.json")}. Without it nothing is saved. See <a href="#/window/saving">Saving</a>.`],
      [c("Folder"), "string", c('"GainUI"'), "The workspace folder settings are saved in."],
      [c("ToggleKey"), "key", c('"RightShift"'), `The key that shows and hides the window. See <a href="#/guides/keys">Key names</a>.`],
      [c("Accent"), "hex / Color3", c('"568cff"'), "The highlight color. Users can change it in Settings."],
      [c("Size"), "{w, h}", c("{620, 460}"), "Window size in pixels (at least 460 × 320). It shrinks to fit small screens."],
      [c("Open"), "boolean", c("true"), `Start shown. With ${c("false")}, the window waits for the toggle key.`],
      [c("Settings"), "boolean", c("true"), `Add the built-in Settings tab (show/hide key, accent, mouse offset, reset, unload).`],
      [c("MouseOffset"), "number", c("0"), "Pixels added to the mouse's y. Users can adjust it in Settings if clicks land off."],
      [c("Theme"), "table", "none", `Override colors: ${c("bg")}, ${c("side")}, ${c("panel")}, ${c("card")}, ${c("cardHover")}, ${c("line")}, ${c("text")}, ${c("dim")}, ${c("faint")} (hex strings or Color3).`],
      [c("OnUnload"), "function", "none", "Runs when the window is destroyed (from code or Settings → Unload). Clean up your connections here."],
    ]) + hint(`The window starts centered. Users can drag it by the title area, and it remembers where it was until the script ends.`) },

  { group: "Window", id: "window/methods", title: "Window methods", icon: "layers", lead: "Everything a window can do after it's made.",
    body: () => table(["Method", "Description"], [
      [c("Window:Tab(name) -> Tab"), `Adds a tab to the sidebar. Aliases: ${c("CreateTab")}, ${c("AddTab")}.`],
      [c("Window:SelectTab(tab | name)"), "Switches to a tab."],
      [c("Window:Notify(options)"), `Shows a notification. See <a href="#/window/notify">Notifications</a>.`],
      [c("Window:Toggle(open?)"), "Shows or hides the window. Without an argument, it flips."],
      [c("Window:IsOpen() -> boolean"), "Whether the window is shown."],
      [c("Window:SetAccent(color)"), "Changes the accent (hex string or Color3)."],
      [c("Window:GetAccent() -> Color3"), "The current accent."],
      [c("Window:SetToggleKey(key)"), "Changes the show/hide key."],
      [c("Window:GetToggleKey() -> string"), `The show/hide key's name, like ${c('"RightShift"')}.`],
      [c("Window:SetTitle(title, subtitle?)"), "Changes the title (and subtitle)."],
      [c("Window:Save()"), "Saves flags right away (normally a second after the last change)."],
      [c("Window:Destroy()"), `Removes the window and everything it drew, and gives input back to the game. Alias: ${c("Unload")}.`],
      [c("Window:Dump() -> string"), "Every text on screen with its position. Handy for checking a layout from a script."],
    ]) + `<h2 id="fields">Fields</h2>` + table(["Field", "Description"], [
      [c("Window.Flags"), "This window's flagged elements, by flag."],
      [c("Window.Tabs"), "The tabs, in order."],
      [c("Window.SettingsTab"), "The built-in Settings tab. Add your own elements to it if you like."],
    ]) + `<h2 id="library">Library functions</h2>` + table(["Function", "Description"], [
      [c("GainUI:CreateWindow(options)"), `Makes a window. Alias: ${c("GainUI:Window")}.`],
      [c("GainUI:Notify(options)"), "A notification on the newest window."],
      [c("GainUI:Destroy()"), "Destroys every window."],
      [c("GainUI.Flags"), "Every flagged element from every window."],
      [c("GainUI.Hex(hex) -> Color3"), `${c('"ff5050"')} to a Color3.`],
      [c("GainUI.KeyLabel(key) -> string"), `How a key is shown, like ${c('"Right Shift"')}.`],
      [c("GainUI.Version"), "The library version."],
    ]) },

  { group: "Window", id: "window/notify", title: "Notifications", icon: "bell", lead: "Short messages that slide in at the bottom right, even while the window is hidden.",
    body: () => sig("Window:Notify({Title, Content?, Duration?})") + code(`Window:Notify({
    Title = "Saved",
    Content = "Your settings were saved.",
    Duration = 4, -- seconds
})`) + opts([
      [c("Title"), "string", c('"Notice"'), "The bold first line."],
      [c("Content"), "string", "none", "More text. It wraps."],
      [c("Duration"), "number", c("4"), "Seconds before it fades out. A thin bar shows the time left."],
    ]) + `<p>Up to five show at once; the oldest goes first. ${c('Window:Notify("Text")')} works too, using the text as the title.</p>` },

  { group: "Window", id: "window/saving", title: "Saving & Flags", icon: "save", lead: "Give an element a Flag and its value is saved and restored between runs.",
    body: () => code(`local Window = GainUI:CreateWindow({Title = "My Script", ConfigName = "myscript"})
local Main = Window:Tab("Main")

Main:Toggle({Name = "Enabled", Flag = "Enabled", Callback = function(on) ... end})

-- anywhere later:
if GainUI.Flags.Enabled.Value then ... end`) + `
<h2 id="how">How it works</h2>
<ul>
<li>With a ${c("ConfigName")}, flagged values are written to ${c("GainUI/<ConfigName>.json")} in Matcha's workspace, a second after the last change and when the window is destroyed.</li>
<li>When the script runs again, each flagged element starts from its saved value instead of its ${c("Default")}.</li>
<li>For a restored value, the element's ${c("Callback")} runs once on the first frame, so your script applies it just like a click would. Keybinds are the exception: they only fire on a key press.</li>
<li>The show/hide key, the accent and the mouse offset from the Settings tab are saved too.</li>
</ul>
<h2 id="flags">Reading flags</h2>
<p>${c("GainUI.Flags[flag]")} (and ${c("Window.Flags[flag]")}) is the element itself, so you can read ${c(".Value")} or call ${c(":Set()")} from anywhere.</p>
${code(`GainUI.Flags.Speed:Set(50)          -- moves the slider and runs its callback
print(GainUI.Flags.Mode.Value)      -- "Balanced"`)}
${hint(`Flags must be unique across windows. Use a prefix like ${c('"MyScript_Speed"')} if several scripts share a session.`)}
<h2 id="format">What gets saved</h2>
${table(["Element", "Saved as"], [
  ["Toggle", "true / false"], ["Slider", "number"], ["Dropdown", "string, or a list for Multi"], ["Textbox", "string"],
  ["Keybind", `key name, like ${c('"G"')} or ${c('"None"')}`], ["Colorpicker", `${c('{"color": "ff5050"}')}`],
])}` },

  { group: "Elements", id: "elements/tab", title: "Tabs & Sections", icon: "layers", lead: "Tabs are the pages in the sidebar. Sections and dividers group the elements inside one.",
    body: () => sig("Window:Tab(name: string) -> Tab") + code(`local Main = Window:Tab("Main")
Main:Section("Movement")
Main:Toggle({Name = "Fly"})
Main:Divider()
Main:Toggle({Name = "Noclip"})`) + `
<p>Elements stack from top to bottom in the order you add them. When a tab gets longer than the window, it scrolls: drag the page, drag its scrollbar, or use <kbd>Page Up</kbd> / <kbd>Page Down</kbd> and the arrow keys while pointing at it.</p>
<h2 id="section">Section</h2>
${sig("Tab:Section(name: string)")}
<p>A small accent heading with a line, to split a tab into groups.</p>
<h2 id="divider">Divider</h2>
${sig("Tab:Divider()")}
<p>A thin line with no text.</p>
${hint(`The Settings tab always stays last, even for tabs you add after the window is made.`)}` },

  { group: "Elements", id: "elements/button", title: "Button", icon: "click", lead: "Runs a function when clicked.",
    body: () => sig("Tab:Button({Name, Callback})") + code(`Main:Button({
    Name = "Teleport to spawn",
    Callback = function()
        print("clicked")
    end,
})`) + opts([
      [c("Name"), "string", "none", "The label."],
      [c("Callback"), "function()", "none", "Runs on click, in its own thread, so it can wait."],
    ]) + ELEMENT_RETURNS },

  { group: "Elements", id: "elements/toggle", title: "Toggle", icon: "toggle", lead: "An on/off switch.",
    body: () => sig("Tab:Toggle({Name, Default?, Flag?, Callback?}) -> Element") + code(`local Esp = Main:Toggle({
    Name = "Show names",
    Default = false,
    Flag = "ShowNames",
    Callback = function(on)
        print("Show names:", on)
    end,
})

Esp:Set(true)       -- turn it on from code
print(Esp.Value)    -- true`) + opts([

    body: () => `
<h2 id="drawn">Everything is drawn</h2>
<p>Matcha can't create instances, so there are no ScreenGuis. Every window is made of Drawing objects: squares, text, lines, circles and images. They're redrawn every frame from a pool, and a property is only written when it changes, so an idle window costs almost nothing.</p>
<h2 id="input">Input</h2>
<ul>
<li><b>No mouse wheel.</b> Matcha can't read it. Pages scroll by dragging them, dragging the scrollbar, or with <kbd>Page Up</kbd> / <kbd>Page Down</kbd> and the arrow keys while pointing at them.</li>
<li><b>Clicks count on release.</b> So pressing and dragging scrolls instead of clicking whatever you started on.</li>
<li><b>The game doesn't get your clicks.</b> While the mouse is over the window, or you're typing or binding a key, GainUI calls ${c("setrobloxinput(false)")}, and gives input back afterwards.</li>
<li><b>Clicks land off?</b> Some setups report the mouse a few pixels away from where it's drawn. Users can fix it in <b>Settings → Mouse offset</b>, or you can set ${c("MouseOffset")}. The value is saved.</li>
<li><b>Roblox must be focused.</b> Keys and clicks are read with ${c("iskeypressed")} and ${c("ismouse1pressed")}. They're ignored while another window is in front.</li>
</ul>
<h2 id="callbacks">Callbacks</h2>
<p>The window runs from a ${c("RenderStepped")} connection. That keeps it alive after your script finishes (in Matcha, a loop in a spawned thread can stop resuming). Callbacks run inside that step and are wrapped in ${c("pcall")}: an error is printed and the window keeps going.</p>
${hint(`Keep callbacks short. For anything that waits or loops, start your own thread: ${c("Callback = function(on) task.spawn(doLongThing, on) end")}. Button callbacks already get their own thread.`)}
<h2 id="text">Text</h2>
<p>Matcha draws text a little higher than its position. GainUI shifts it back, and measures text with ${c("TextBounds")} so long labels get trimmed with ".." instead of overflowing.</p>
<h2 id="unload">Unloading</h2>
<p>${c("Window:Destroy()")} (or <b>Settings → Unload</b>) removes every drawing, disconnects the render step, gives input back to the game, saves flags and calls your ${c("OnUnload")}. Disconnect your own connections there.</p>

// Routing & rendering
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
const groupsEl = document.getElementById("groups"), pillsEl = document.getElementById("pills"), doc = document.getElementById("doc");
const GROUPS = [...new Set(PAGES.map(p => p.group))];

function renderNav(page) {
  groupsEl.innerHTML = GROUPS.map(g => {
    const first = PAGES.find(p => p.group === g);
    return `<a href="#/${first.id}" class="${g === page.group ? "active" : ""}">${GROUP_LABEL[g] || g}</a>`;
  }).join("") + `<span class="seg-ind"></span>`;
  pillsEl.innerHTML = PAGES.filter(p => p.group === page.group)
    .map(p => `<a class="pill ${p === page ? "active" : ""}" href="#/${p.id}">${svg(p.icon)}${p.title}</a>`).join("");
  requestAnimationFrame(moveIndicator);
}
let indReady = false;
function moveIndicator() {
  const ind = groupsEl.querySelector(".seg-ind"), act = groupsEl.querySelector("a.active");
  if (!ind || !act) return;
  if (!indReady) ind.style.transition = "none";
  ind.style.width = act.offsetWidth + "px";
  ind.style.transform = `translateX(${act.offsetLeft}px)`;
  ind.style.opacity = 1;
  if (!indReady) { ind.offsetWidth; ind.style.transition = ""; indReady = true; }
}
window.addEventListener("resize", moveIndicator);

function highlight(src) {
  const KW = /^(local|function|end|if|then|else|elseif|for|in|do|while|repeat|until|return|and|or|not|nil|true|false|break)$/;
  const re = /(--[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b(?=\s*\()|\b([A-Za-z_]\w*)\b/g;
  return src.replace(re, (m, com, str, num, fn, word) => {
    if (com) return `<span class="tok-com">${com}</span>`;
    if (str) return `<span class="tok-str">${str}</span>`;
    if (num) return `<span class="tok-num">${num}</span>`;
    if (fn) return KW.test(fn) ? `<span class="tok-kw">${fn}</span>` : `<span class="tok-fn">${fn}</span>`;
    if (word && KW.test(word)) return `<span class="tok-kw">${word}</span>`;
    return m;
  });
}
function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

function heroHead(page) {
  return `<div class="hero">
    <div>
      <h1>Gain-style windows, <em>drawn for Matcha</em></h1>
      <p class="lead">${page.lead}</p>
      <div class="hero-actions"><button class="btn primary" data-copy-loader>Copy loader</button><a class="btn" href="#/start/example">See the example</a></div>
    </div>
    <div class="preview"><div class="gw">
      <div class="gs"><div class="t">My Script</div><div class="st">v1.0</div><div class="tab on">Main</div><div class="tab">Visuals</div><div class="tab">Settings</div></div>
      <div class="gp"><h5>Main</h5><div class="sec">GENERAL</div>
        <div class="row">Enabled<span class="sw"></span></div>
        <div class="row">Show names<span class="sw off"></span></div>
        <div class="row sl"><div class="l">Walk speed<span>42 studs</span></div><div class="tr"><i></i></div></div>
      </div>
    </div></div>
  </div>`;
}

function render() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [pid, anchor] = hash.split("#");
  const page = byId[pid] || byId[""];
  const idx = PAGES.indexOf(page);
  const prev = PAGES[idx - 1], next = PAGES[idx + 1];
  let body = page.body();
  if (page.hero) body += `<h2 id="elements">Elements</h2>` + tileGrid();
  doc.innerHTML = (page.hero ? heroHead(page) : `
    <div class="crumbs"><b>${GROUP_LABEL[page.group] || page.group}</b><span>›</span>${page.title}</div>
    <div class="title-row"><span class="title-ico">${svg(page.icon)}</span><h1>${page.title}</h1></div>
    <p class="lead">${page.lead}</p><div class="jump" id="jump"></div>`) + body + `
    <nav class="pager">
      ${prev ? `<a href="#/${prev.id}"><span>‹</span><span><small>Previous</small><b>${prev.title}</b></span></a>` : ""}
      ${next ? `<a class="next" href="#/${next.id}"><span><small>Next</small><b>${next.title}</b></span><span>›</span></a>` : ""}
    </nav>
    <p class="updated">${UPDATED}</p>`;
  doc.querySelectorAll('code[data-lang="lua"]').forEach(el => { el.innerHTML = highlight(el.innerHTML); });
  doc.querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", () => {
    copy(btn.closest(".code").querySelector("code").innerText, "Code copied");
  }));
  doc.querySelectorAll("[data-copy-loader]").forEach(b => b.addEventListener("click", copyLoader));
  // headings: ids, anchors, and the jump chips under the lead
  const heads = [...doc.querySelectorAll("h2")];
  const jump = document.getElementById("jump");
  heads.forEach(h => {
    h.id = h.id || slug(h.textContent);
    h.insertAdjacentHTML("beforeend", `<a class="anchor" href="#/${page.id}#${h.id}">#</a>`);
  });
  if (jump) jump.innerHTML = heads.length >= 2 ? heads.map(h => `<a href="#/${page.id}#${h.id}">${h.childNodes[0].textContent}</a>`).join("") : "";
  doc.querySelectorAll("h3").forEach(h => { h.id = h.id || slug(h.textContent); });
  bindTiles();
  renderNav(page);
  document.title = page.id ? `${page.title} | GainUI` : "GainUI - drawn GUIs for Matcha";
  if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

// Tiles lean toward the pointer
function bindTiles() {
  doc.querySelectorAll(".tile").forEach(t => {
    t.addEventListener("pointermove", e => {
      const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      t.style.setProperty("--rx", `${(0.5 - y) * 10}deg`); t.style.setProperty("--ry", `${(x - 0.5) * 12}deg`);
      t.style.setProperty("--mx", `${x * 100}%`); t.style.setProperty("--my", `${y * 100}%`);
    });
    t.addEventListener("pointerleave", () => { t.style.setProperty("--rx", "0deg"); t.style.setProperty("--ry", "0deg"); });
  });
}

// Copying
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600); }
function copy(text, msg) { navigator.clipboard.writeText(text).then(() => toast(msg), () => toast("Couldn't copy - select it instead")); }
function copyLoader() { copy(LOAD, "Loader copied - paste it at the top of your script"); }
document.getElementById("copyLoader").addEventListener("click", copyLoader);
document.getElementById("loaderText").textContent = LOAD;

// Search
const sd = document.getElementById("sd"), sq = document.getElementById("sq"), sres = document.getElementById("sres");
const index = PAGES.map(p => {
  const div = document.createElement("div"); div.innerHTML = p.body();
  return {p, text: (p.title + " " + p.lead + " " + div.textContent).replace(/\s+/g, " ")};
});
let sel = 0;
function search() {
  const q = sq.value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const hits = !q ? index.slice(0, 8) : index.filter(e => words.every(w => e.text.toLowerCase().includes(w)))
    .sort((a, b) => (b.p.title.toLowerCase().includes(q)) - (a.p.title.toLowerCase().includes(q)));
  sel = 0;
  sres.innerHTML = hits.length ? hits.map((e, i) => {
    let snip = e.p.lead;
    if (q) { const at = e.text.toLowerCase().indexOf(words[0]); if (at > 0) snip = "..." + e.text.slice(Math.max(0, at - 40), at + 80) + "..."; }
    return `<a href="#/${e.p.id}" class="${i === 0 ? "sel" : ""}">${e.p.title}<small>${esc(snip)}</small></a>`;
  }).join("") : `<div class="none">No results for "${esc(q)}"</div>`;
}
function openSearch() { sd.classList.add("open"); sq.value = ""; search(); setTimeout(() => sq.focus(), 0); }
function closeSearch() { sd.classList.remove("open"); }
document.getElementById("searchBtn").addEventListener("click", openSearch);
sd.addEventListener("click", e => { if (e.target === sd || e.target.closest("a")) closeSearch(); });
sq.addEventListener("input", search);
sq.addEventListener("keydown", e => {
  const items = [...sres.querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length);
    items.forEach((a, i) => a.classList.toggle("sel", i === sel));
    items[sel] && items[sel].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && items[sel]) { location.hash = items[sel].getAttribute("href"); closeSearch(); }
  else if (e.key === "Escape") closeSearch();
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); sd.classList.contains("open") ? closeSearch() : openSearch(); }
  else if (e.key === "/" && !sd.classList.contains("open") && document.activeElement.tagName !== "INPUT") { e.preventDefault(); openSearch(); }
});

render();
</script>
</body>
</html>
